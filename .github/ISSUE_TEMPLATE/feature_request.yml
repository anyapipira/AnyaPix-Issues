name: Feature request / 要望
description: Suggest an idea or improvement. / アイデアや改善の提案
labels: [enhancement]
body:
  - type: dropdown
    id: product
    attributes:
      label: Product / 製品
      options:
        - Web editor (pix.anya.party) / Web 版エディタ
        - Drawing Tablet / ドット絵タブレット
        - Import Egg Frame / 入力フレーム
        - Preset Egg Frame / プリセットフレーム
        - Pets / ペット
        - Other / その他
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like? / どんな機能がほしいですか
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: How would you use it? / どのように使いたいですか
